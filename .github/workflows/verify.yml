name: verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test

  packages:
    name: package-${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15-intel
          - platform: windows-x64
            os: windows-latest
            runtime: win-x64
          - platform: windows-arm64
            os: windows-latest
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Build and self-test macOS universal helper
        if: runner.os == 'macOS'
        env:
          DSH_MACOS_ARCH: universal
        run: npm run build:macos
      - name: Build, self-test and publish Windows helper
        if: runner.os == 'Windows'
        run: npm run build:windows -- -Runtime ${{ matrix.runtime }}
      - name: Pack the platform plugin
        run: npm run pack:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/*-${{ matrix.platform }}.tgz
          if-no-files-found: error
          retention-days: 14
